<svg xmlns="http://www.w3.org/2000/svg" width="720" height="482" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 720 482"><rect width="720" height="482" fill="#fff"/><text x="20" y="28" fill="#212529" font-size="14" font-weight="bold">1 — Centered and aligned: the ground roll follows the runway</text><rect width="600" height="120" x="60" y="48" fill="#f1f0ec" stroke="#ced4da" rx="6"/><text x="72" y="68" fill="#868e96" font-size="11">Runway</text><line x1="80" x2="645" y1="118" y2="118" stroke="#adb5bd" stroke-dasharray="14 10" stroke-width="2"/><text x="95" y="142" fill="#868e96" font-size="11">Runway centerline</text><circle cx="600" cy="118" r="7" fill="#fff" stroke="#4c6ef5" stroke-width="2"/><line x1="600" x2="600" y1="127" y2="174" stroke="#4c6ef5" stroke-dasharray="3 3" stroke-width="1"/><text x="563" y="190" fill="#4c6ef5" font-size="11">Takeoff waypoint</text><path fill="#fff4e6" stroke="#d9480f" stroke-width="2" d="M 118 118 L 100 107 L 106 118 L 100 129 Z"/><text x="86" y="100" fill="#868e96" font-size="11">Start</text><line x1="128" x2="575" y1="118" y2="118" stroke="#d9480f" stroke-width="2.5"/><path fill="#d9480f" d="M 575 112 L 589 118 L 575 124 Z"/><text x="170" y="96" fill="#d9480f" font-size="12">Yaw setpoint = bearing to the takeoff waypoint</text><text x="20" y="238" fill="#212529" font-size="14" font-weight="bold">2 — Offset from the centerline: the ground roll cuts across the runway</text><rect width="600" height="162" x="60" y="258" fill="#f1f0ec" stroke="#ced4da" rx="6"/><text x="72" y="278" fill="#868e96" font-size="11">Runway</text><line x1="80" x2="645" y1="310" y2="310" stroke="#adb5bd" stroke-dasharray="14 10" stroke-width="2"/><text x="95" y="334" fill="#868e96" font-size="11">Runway centerline</text><circle cx="600" cy="310" r="7" fill="#fff" stroke="#4c6ef5" stroke-width="2"/><line x1="600" x2="600" y1="319" y2="428" stroke="#4c6ef5" stroke-dasharray="3 3" stroke-width="1"/><text x="563" y="444" fill="#4c6ef5" font-size="11">Takeoff waypoint</text><path fill="#fff4e6" stroke="#d9480f" stroke-width="2" d="M 145 372 L 124 363 L 131 373 L 126 385 Z"/><text x="72" y="394" fill="#868e96" font-size="11">Start, off the</text><text x="72" y="406" fill="#868e96" font-size="11">centerline</text><line x1="155" x2="298" y1="376" y2="376" stroke="#868e96" stroke-dasharray="6 5" stroke-width="1.5"/><path fill="#868e96" d="M 298 372.5 L 308 376 L 298 379.5 Z"/><text x="196" y="393" fill="#868e96" font-size="11">runway direction</text><line x1="155" x2="573" y1="371" y2="314.6" stroke="#d9480f" stroke-width="2.5"/><path fill="#d9480f" d="M 572.9 320.8 L 586 313 L 571.3 309 Z"/><text x="170" y="296" fill="#d9480f" font-size="12">Ground roll: straight line towards the takeoff waypoint</text></svg>