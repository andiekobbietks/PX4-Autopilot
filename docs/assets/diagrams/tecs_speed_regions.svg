<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 760 300"><rect width="760" height="300" fill="#fff"/><text x="24" y="32" fill="#212529" font-size="15" font-weight="bold">Pitch and throttle roles with an airspeed setpoint above trim</text><text x="24" y="52" fill="#868e96" font-size="12">Depending on the measured airspeed, for FW_T_SPDWEIGHT up to 1.</text><rect width="190" height="150" x="130" y="70" fill="#e7f5ff" stroke="#a5d8ff"/><rect width="220" height="150" x="320" y="70" fill="#ebfbee" stroke="#b2f2bb"/><rect width="196" height="150" x="540" y="70" fill="#fff4e6" stroke="#ffd8a8"/><text x="225" y="88" fill="#1971c2" font-size="12" font-weight="bold" text-anchor="middle">Below trim</text><text x="430" y="88" fill="#2f9e44" font-size="12" font-weight="bold" text-anchor="middle">Between trim and setpoint</text><text x="638" y="88" fill="#e8590c" font-size="12" font-weight="bold" text-anchor="middle">Above setpoint</text><line x1="24" x2="736" y1="152" y2="152" stroke="#ced4da" stroke-dasharray="4 4"/><text x="24" y="122" fill="#212529" font-size="13" font-weight="bold">Pitch loop</text><text x="24" y="192" fill="#212529" font-size="13" font-weight="bold">Throttle loop</text><text x="225" y="115" fill="#212529" font-size="12" text-anchor="middle">Trades height for speed,</text><text x="225" y="131" fill="#212529" font-size="12" text-anchor="middle">aiming for trim airspeed</text><text x="430" y="115" fill="#212529" font-size="12" text-anchor="middle">Holds height only,</text><text x="430" y="131" fill="#212529" font-size="12" text-anchor="middle">ignores airspeed</text><text x="638" y="115" fill="#212529" font-size="12" text-anchor="middle">Trades speed for height</text><text x="638" y="131" fill="#212529" font-size="12" text-anchor="middle">to correct the overspeed</text><text x="225" y="177" fill="#212529" font-size="12" text-anchor="middle">Accelerates towards</text><text x="225" y="193" fill="#212529" font-size="12" text-anchor="middle">the airspeed setpoint</text><text x="430" y="177" fill="#212529" font-size="12" text-anchor="middle">Accelerates towards the setpoint</text><text x="430" y="195" fill="#868e96" font-size="11" text-anchor="middle">At FW_THR_MAX the vehicle settles</text><text x="430" y="209" fill="#868e96" font-size="11" text-anchor="middle">here, holding altitude</text><text x="638" y="177" fill="#212529" font-size="12" text-anchor="middle">Reduces throttle</text><text x="638" y="193" fill="#212529" font-size="12" text-anchor="middle">to slow down</text><line x1="130" x2="724" y1="240" y2="240" stroke="#495057" stroke-width="2"/><path fill="#495057" d="M 724 234 L 738 240 L 724 246 Z"/><text x="736" y="262" fill="#495057" font-size="12" text-anchor="end">Measured airspeed</text><line x1="320" x2="320" y1="70" y2="248" stroke="#1971c2" stroke-width="2"/><text x="320" y="264" fill="#1971c2" font-size="12" font-weight="bold" text-anchor="middle">Trim airspeed</text><text x="320" y="280" fill="#868e96" font-size="11" text-anchor="middle">FW_AIRSPD_TRIM</text><line x1="540" x2="540" y1="70" y2="248" stroke="#e8590c" stroke-width="2"/><text x="540" y="264" fill="#e8590c" font-size="12" font-weight="bold" text-anchor="middle">Airspeed setpoint</text></svg>